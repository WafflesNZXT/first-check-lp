# fly.toml app configuration file generated for audo-live-agent on 2026-05-07T06:30:01Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'audo-live-agent'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  LIVE_AGENT_WORKER_HOST = "0.0.0.0"
  LIVE_AGENT_WORKER_PORT = "8080"
  LIVE_AGENT_POLL_JOBS = "true"
  LIVE_AGENT_HEADLESS = "true"
  LIVE_AGENT_BROWSER_RESTARTS = "1"
  LIVE_AGENT_RUN_TIMEOUT_SECONDS = "300"
  LIVE_AGENT_STEP_TIMEOUT_SECONDS = "60"
  TIMEOUT_BrowserStartEvent = "90"
  LIVE_AGENT_STALE_AFTER_SECONDS = "240"
  LIVE_AGENT_SCREENSHOT_BUCKET = "agent-screenshots"
  LIVE_AGENT_LOCAL_SCREENSHOT_FALLBACK = "false"
  BROWSER_USE_CDP_CONNECT_TIMEOUT = "60"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 2048
